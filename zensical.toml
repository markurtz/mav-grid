[project]
site_name = "MAV Grid"
site_url = "https://markurtz.github.io/mav-grid/"
site_description = "MAV Grid: an open, parametric dovetail-groove grid and face-plate standard, with its schema, CAD generators, plates, adapters and samples."
site_author = "markurtz"
repo_url = "https://github.com/markurtz/mav-grid"
repo_name = "markurtz/mav-grid"

[project.extra.version]
provider = "mike"
default = "latest"


[project.theme]
variant = "modern"
features = ["navigation.indexes"]
logo = "assets/branding/icon-magenta.svg"
favicon = "assets/branding/icon-magenta.png"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.macros]
module_name = "docs/scripts/macros"

[project.plugins.mkdocstrings]
handlers = { python = { paths = ["src"] } }
